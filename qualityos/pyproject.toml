[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qualityos"
version = "0.1.0"
description = "Local scope-aware quality evidence and simulation workflow"
requires-python = ">=3.10"
dependencies = ["fastapi==0.111.0", "pydantic==2.7.4", "SQLAlchemy==2.0.43", "uvicorn==0.30.1", "httpx==0.28.1"]

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]
addopts = "-q"
